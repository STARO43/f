<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%23f4f1e9'/%3E%3Crect%20x='14'%20y='14'%20width='36'%20height='36'%20fill='%23ec5b6a'/%3E%3C/svg%3E"/>
  <meta name="description" content="Энергия — мера движения материи. Интерактивные 3D-опыты по физике: прогноз, эксперимент и разбор каждой из десяти глав."/>
  <title>Энергия — мера движения материи</title>
  <script>
    (function () {
      try {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) document.documentElement.classList.add('dark-mode');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./assets/app.css"/>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#f4f1e9;color:#111;font-family:Helvetica,Arial,sans-serif;text-align:center;padding:24px">
      <div><strong>Требуется JavaScript</strong><p>Эта интерактивная сцена использует Three.js для отображения экспериментов.</p></div>
    </div>
  </noscript>
  <script src="./assets/app.js" defer></script>
</body>
</html>
